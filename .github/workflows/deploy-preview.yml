name: Deploy Preview

on:
  push:
    branches: [preview/**]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FLY_REGION: 'lax'
  FLY_APP_SUFFIX: 'preview'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build + Lighthouse Audit (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-audit:
    name: Build & Audit
    runs-on: ubuntu-latest
    outputs:
      staging-url: ${{ steps.deploy.outputs.staging-url }}
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # Kilo + deploy_specialist for Fly.io deployment
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for Kilo CLI
        id: check-kilo
        run: |
          if command -v kilo &> /dev/null || command -v npx &> /dev/null; then
            echo "kilo-available=true" >> $GITHUB_OUTPUT
          else
            echo "kilo-available=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via Kilo + deploy_specialist (Fly.io MCP)
        id: deploy
        if: steps.check-kilo.outputs.kilo-available == 'true'
        env:
          SITE_SLUG: ${{ github.head_ref || github.ref_name }}
        run: |
          # Sanitize branch name for Fly app naming
          SAFE_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | head -c 30)
          APP_NAME="elyra-${SAFE_BRANCH}"
          
          # Build prompt for Kilo deploy_specialist persona
          PROMPT="Deploy the built site at . to Fly.io as a preview app.
          
App name: ${APP_NAME}
Organization: personal
Region: lax
TTL: 7 days

Using Fly.io MCP tools:
1. Create Fly app: fly apps create ${APP_NAME} (org: personal, region: lax)
   - If app already exists, get existing app
2. Deploy: fly deploy --remote-only from current directory
   - Requires fly.toml or Dockerfile in the project directory
3. Get the deployed app status and .fly.dev URL

Return ONLY valid JSON:
{
  \"success\": true/false,
  \"app_name\": \"${APP_NAME}\",
  \"preview_url\": \"https://${APP_NAME}.fly.dev\",
  \"deployed_at\": \"ISO timestamp\",
  \"errors\": []
}"

          # Run Kilo with deploy_specialist persona
          kilo run --persona registry/personas/deploy_specialist.md --format json -- -- "${PROMPT}" || echo '{"success": false}'
          
          echo "preview-url=https://${APP_NAME}.fly.dev" >> $GITHUB_OUTPUT
          echo "staging-url=https://${APP_NAME}.fly.dev" >> $GITHUB_OUTPUT

      # Fallback: direct Fly CLI if Kilo not available
      - name: Setup Fly CLI (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          api-token: ${{ secrets.FLY_API_TOKEN }}

      - name: Generate Fly app name (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: fly-name
        run: |
          SAFE_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | head -c 30)
          echo "app-name=elyra-${SAFE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Deploy to Fly.io Preview (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: deploy-fallback
        uses: superfly/flyctl-actions/deploy-flyctl@master
        with:
          api-token: ${{ secrets.FLY_API_TOKEN }}
          args: --remote-only
        env:
          FLY_APP: ${{ steps.fly-name.outputs.app-name }}
          FLY_REGION: ${{ env.FLY_REGION }}
        continue-on-error: true

      - name: Get Fly app status (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: fly-status
        run: |
          flyctl status --app ${{ steps.fly-name.outputs.app-name }} --json || echo '{}'
        continue-on-error: true

      - name: Set output staging URL (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: staging-url-fallback
        run: |
          URL="https://${{ steps.fly-name.outputs.app-name }}.fly.dev"
          echo "staging-url=$URL" >> $GITHUB_OUTPUT
          echo "preview-url=$URL" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Lighthouse Audit
        if: success()
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.deploy.outputs.staging-url || 'https://placeholder.fly.dev' }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Post Preview URL as PR Comment
  # ─────────────────────────────────────────────────────────────────────────────
  comment-preview-url:
    name: Post Preview URL
    runs-on: ubuntu-latest
    needs: build-and-audit
    if: always()
    steps:
      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const previewUrl = '${{ needs.build-and-audit.outputs.preview-url }}';
            const status = ${{ needs.build-and-audit.result }} === 'success' ? '✅ Deployed' : '⚠️ Deploy failed';

            const comment = `
            ## ${status} — Preview Available

            **Preview URL:** ${previewUrl || 'Pending...'}
            **Branch:** \`${{ github.head_ref || github.ref_name }}\`

            | Check | Status |
            |-------|--------|
            | Build | ${status} |
            | Lighthouse | See artifacts |

            ---
            *This preview will be automatically deleted after 7 days.*
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview Available')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            }
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
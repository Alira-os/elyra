name: Deploy Preview

on:
  push:
    branches: [preview/**]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build + Lighthouse Audit (parallel matrix)
  # Default platform: Cloudflare. Fly.io fallback lives in deploy-flyio-preview.yml
  # and is triggered only when the project has been re-architected to fly-io.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-audit:
    name: Build & Audit
    runs-on: ubuntu-latest
    outputs:
      staging-url: ${{ steps.deploy.outputs.staging-url }}
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # Kilo + deploy_specialist for Cloudflare deploy
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for Kilo CLI
        id: check-kilo
        run: |
          if command -v kilo &> /dev/null || command -v npx &> /dev/null; then
            echo "kilo-available=true" >> $GITHUB_OUTPUT
          else
            echo "kilo-available=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via Kilo + deploy_specialist (Cloudflare MCP)
        id: deploy
        if: steps.check-kilo.outputs.kilo-available == 'true'
        env:
          SITE_SLUG: ${{ github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sanitize branch name for Cloudflare Workers project naming
          SAFE_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | head -c 30)
          PROJECT_NAME="elyra-${SAFE_BRANCH}"
          PREVIEW_URL="https://${PROJECT_NAME}.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"

          # Build prompt for Kilo deploy_specialist persona
          PROMPT="Deploy the built site at . to Cloudflare as a preview Worker.

Project name: ${PROJECT_NAME}
Account ID: ${CLOUDFLARE_ACCOUNT_ID}
Substrate: workers (default; switch to workers-containers only if the project declares it in wrangler.toml)

Using Cloudflare MCP tools:
1. Ensure account-level resources exist (D1, R2, KV, Vectorize bindings per wrangler.toml) — apply infra/cloudflare/ if needed.
2. Run: wrangler deploy (remote build) from the project directory.
   - Requires wrangler.toml or wrangler.jsonc at the project root.
   - All bindings, vars, and Secret Store references must already be declared.
3. Return the deployment version ID and the *.workers.dev URL.

Return ONLY valid JSON:
{
  \"success\": true/false,
  \"project_name\": \"${PROJECT_NAME}\",
  \"preview_url\": \"${PREVIEW_URL}\",
  \"deployed_at\": \"ISO timestamp\",
  \"version_id\": \"...\",
  \"errors\": []
}"

          # Run Kilo with deploy_specialist persona
          kilo run --persona registry/personas/deploy_specialist.md --format json -- -- "${PROMPT}" || echo '{"success": false}'

          echo "preview-url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "staging-url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

      # Fallback: direct wrangler deploy if Kilo not available
      - name: Setup Wrangler (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        run: npm install --no-save wrangler@latest

      - name: Generate Cloudflare project name (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: cf-name
        run: |
          SAFE_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | head -c 30)
          echo "project-name=elyra-${SAFE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare Preview (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: deploy-fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --name "elyra-${{ steps.cf-name.outputs.project-name }}" --remote
        continue-on-error: true

      - name: Set output staging URL (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: staging-url-fallback
        run: |
          URL="https://elyra-${{ steps.cf-name.outputs.project-name }}.${{ vars.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "staging-url=$URL" >> $GITHUB_OUTPUT
          echo "preview-url=$URL" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Lighthouse Audit
        if: success()
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.deploy.outputs.staging-url || 'https://placeholder.workers.dev' }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Post Preview URL as PR Comment
  # ─────────────────────────────────────────────────────────────────────────────
  comment-preview-url:
    name: Post Preview URL
    runs-on: ubuntu-latest
    needs: build-and-audit
    if: always()
    steps:
      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const previewUrl = '${{ needs.build-and-audit.outputs.preview-url }}';
            const status = ${{ needs.build-and-audit.result }} === 'success' ? '✅ Deployed' : '⚠️ Deploy failed';

            const comment = `
            ## ${status} — Preview Available (Cloudflare)

            **Preview URL:** ${previewUrl || 'Pending...'}
            **Branch:** \`${{ github.head_ref || github.ref_name }}\`

            | Check | Status |
            |-------|--------|
            | Build | ${status} |
            | Lighthouse | See artifacts |

            ---
            *This preview is hosted on Cloudflare Workers. It will be removed when the preview branch is deleted.*
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview Available')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            }
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

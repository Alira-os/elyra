name: Deploy Production

on:
  push:
    branches: [main]

# Only one production deploy at a time — prevent concurrent prod deploys
concurrency:
  group: production-deploy
  cancel-in-progress: false  # Don't cancel — let it complete

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  id-token: write  # Required for OIDC to Cloudflare
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and Deploy to Production
  # Default platform: Cloudflare. Fly.io fallback lives in deploy-flyio-production.yml
  # and is triggered only when the project has been re-architected to fly-io.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # Kilo + deploy_specialist for Cloudflare Production Deploy
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for Kilo CLI
        id: check-kilo
        run: |
          if command -v kilo &> /dev/null || command -v npx &> /dev/null; then
            echo "kilo-available=true" >> $GITHUB_OUTPUT
          else
            echo "kilo-available=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via Kilo + deploy_specialist (Cloudflare MCP)
        id: deploy
        if: steps.check-kilo.outputs.kilo-available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ vars.CF_PROJECT_NAME }}
        run: |
          PROJECT_NAME="${{ vars.CF_PROJECT_NAME }}"
          PRODUCTION_URL="https://${PROJECT_NAME}.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"

          # Build prompt for Kilo deploy_specialist persona
          PROMPT="Deploy the built site at . to production on Cloudflare.

Project name: ${PROJECT_NAME}
Account ID: ${CLOUDFLARE_ACCOUNT_ID}
Substrate: workers (default; switch to workers-containers only if the project declares it in wrangler.toml)

Using Cloudflare MCP tools:
1. Ensure account-level resources exist (D1, R2, KV, Vectorize bindings per wrangler.toml) — apply infra/cloudflare/ if needed.
2. Set required Workers vars and Secret Store entries.
3. Run: wrangler deploy (remote build) from the project directory.
   - Requires wrangler.toml or wrangler.jsonc at the project root.
4. Bind the custom domain if vars.CF_CUSTOM_DOMAIN is set (Cloudflare provisions SSL automatically).
5. Promote the deployed version to 100% traffic.

Return ONLY valid JSON:
{
  \"success\": true/false,
  \"production_url\": \"${PRODUCTION_URL}\",
  \"version_id\": \"...\",
  \"deployed_at\": \"ISO timestamp\",
  \"errors\": []
}"

          # Run Kilo with deploy_specialist persona
          kilo run --persona registry/personas/deploy_specialist.md --format json -- -- "${PROMPT}" || echo '{"success": false}'

          echo "production-url=${PRODUCTION_URL}" >> $GITHUB_OUTPUT

      # Fallback: direct wrangler deploy if Kilo not available
      - name: Setup Wrangler (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        run: npm install --no-save wrangler@latest

      - name: Deploy to Cloudflare Production (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: deploy-fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ vars.CF_PROJECT_NAME }}
        run: |
          npx wrangler deploy --name "${{ vars.CF_PROJECT_NAME }}" --remote
        continue-on-error: false

      - name: Set production URL output (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: deploy-output
        run: |
          URL="https://${{ vars.CF_PROJECT_NAME }}.${{ vars.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "production-url=$URL" >> $GITHUB_OUTPUT
        continue-on-error: false

      # ─────────────────────────────────────────────────────────────────────
      # Post-Deploy Verification
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify deployment with Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.deploy.outputs.production-url || format('https://{0}.{1}.workers.dev', vars.CF_PROJECT_NAME, vars.CLOUDFLARE_ACCOUNT_ID) }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true  # Non-blocking — manual review follows

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Post-Deploy Notification (Slack/Teams webhook)
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    steps:
      - name: Post deployment status
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "${{ needs.deploy-production.result == 'success' && '✅' || '❌' }} Production Deploy (Cloudflare): ${{ needs.deploy-production.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy-production.result == 'success' && '✅ Production deployed to Cloudflare' || '❌ Production deploy failed' }}\n<${{ steps.deploy.outputs.production-url }}|View site>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        continue-on-error: true

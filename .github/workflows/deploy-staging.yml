name: Deploy Production

on:
  push:
    branches: [main]

# Only one production deploy at a time — prevent concurrent prod deploys
concurrency:
  group: production-deploy
  cancel-in-progress: false  # Don't cancel — let it complete

env:
  NODE_VERSION: '20'
  FLY_REGION: 'lax'

permissions:
  contents: read
  id-token: write  # Required for OIDC to Fly.io
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and Deploy to Production
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # Kilo + deploy_specialist for Fly.io Production Deploy
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for Kilo CLI
        id: check-kilo
        run: |
          if command -v kilo &> /dev/null || command -v npx &> /dev/null; then
            echo "kilo-available=true" >> $GITHUB_OUTPUT
          else
            echo "kilo-available=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via Kilo + deploy_specialist (Fly.io MCP)
        id: deploy
        if: steps.check-kilo.outputs.kilo-available == 'true'
        env:
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
        run: |
          APP_NAME="${{ vars.FLY_APP_NAME }}"
          
          # Build prompt for Kilo deploy_specialist persona
          PROMPT="Deploy the built site at . to production on Fly.io.

App name: ${APP_NAME}
Organization: personal
Region: lax

Using Fly.io MCP tools:
1. Create Fly app if not exists: fly apps create ${APP_NAME} (org: personal, region: lax)
2. Set required secrets/env vars for the app
3. Deploy: fly deploy --remote-only from current directory
   - Requires fly.toml or Dockerfile in the project directory
4. Allocate IPv4 if needed: fly ips allocate-v4 --app ${APP_NAME}
5. Health check: fly health check --app ${APP_NAME}

Return ONLY valid JSON:
{
  \"success\": true/false,
  \"production_url\": \"https://${APP_NAME}.fly.dev\",
  \"app_id\": \"fly app id\",
  \"deployed_at\": \"ISO timestamp\",
  \"errors\": []
}"

          # Run Kilo with deploy_specialist persona
          kilo run --persona registry/personas/deploy_specialist.md --format json -- -- "${PROMPT}" || echo '{"success": false}'
          
          echo "production-url=https://${APP_NAME}.fly.dev" >> $GITHUB_OUTPUT

      # Fallback: direct Fly CLI if Kilo not available
      - name: Setup Fly CLI (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          api-token: ${{ secrets.FLY_API_TOKEN }}

      - name: Fly Doctor (pre-flight check)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        run: flyctl doctor --app ${{ vars.FLY_APP_NAME }} || true
        continue-on-error: true

      - name: Deploy to Fly.io Production (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: deploy-fallback
        uses: superfly/flyctl-actions/deploy-flyctl@master
        with:
          api-token: ${{ secrets.FLY_API_TOKEN }}
          args: --remote-only
        env:
          FLY_APP: ${{ vars.FLY_APP_NAME }}
          FLY_REGION: ${{ env.FLY_REGION }}
        continue-on-error: false

      - name: Wait for health checks
        if: steps.check-kilo.outputs.kilo-available != 'true'
        run: |
          echo "Checking deployment health..."
          flyctl health check --app ${{ vars.FLY_APP_NAME }} --timeout 60s || true
        continue-on-error: true

      - name: Get deployment status
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: status
        run: |
          flyctl status --app ${{ vars.FLY_APP_NAME }} --json || echo '{}'
        continue-on-error: true

      - name: Set production URL output (fallback)
        if: steps.check-kilo.outputs.kilo-available != 'true'
        id: deploy-output
        run: |
          URL="https://${{ vars.FLY_APP_NAME }}.fly.dev"
          echo "production-url=$URL" >> $GITHUB_OUTPUT
        continue-on-error: false

      # ─────────────────────────────────────────────────────────────────────
      # Post-Deploy Verification
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify deployment with Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ steps.deploy.outputs.production-url || format('https://{0}.fly.dev', vars.FLY_APP_NAME) }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true  # Non-blocking — manual review follows

      - name: Create deployment snapshot
        run: |
          flyctl volumes list --app ${{ vars.FLY_APP_NAME }} --json || echo '[]'
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Post-Deploy Notification (Slack/Teams webhook)
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    steps:
      - name: Post deployment status
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "${{ needs.deploy-production.result == 'success' && '✅' || '❌' }} Production Deploy: ${{ needs.deploy-production.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy-production.result == 'success' && '✅ Production deployed' || '❌ Production deploy failed' }}\n<${{ steps.deploy.outputs.production-url }}|View site>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        continue-on-error: true
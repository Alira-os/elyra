            - heading "Craftsmanship" [level=4] [ref=e306]:
              - generic [ref=e309]: Craftsmanship
            - paragraph [ref=e325]: In raising boys to become men, manual labor will play an indispensable role. St. John Bosco observed that the academic instruction of boys is enhanced by physical work. In part, this is because men are not purely intellectual creatures. They are made for mastery of skills, and the first step is competency, which young men crave. But there are also crucial qualities which cannot be formed in the classroom, in particular the cardinal virtues, which entail mastery of physical passions and right relations with other men. For this, physical work with other men is instrumental, and the skilled trades are especially suitable.

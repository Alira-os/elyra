                              - generic [ref=e211]: Phase I
                            - paragraph [ref=e213]: The Nascent Bosco Program
                            - generic [ref=e217]: From 2022 to 2024, the founders ran the Bosco Program as a stand-alone course. In addition to a single academic class, boys started with tool benches and worked up to both a two-story addition and a barn raising. The course culminated in a communal dinner. During those two years, the Bosco Program showcased just how capable High School boys can be.
                      - listitem [ref=e218]:
                        - generic [ref=e220]:
                          - img [ref=e224]
                          - generic [ref=e227]:
                            - paragraph [ref=e230]:
                              - generic [ref=e231]: Phase II
                            - paragraph [ref=e233]: The First St. Joseph's Summer Camp
                            - generic [ref=e237]: To expand on the initial offering of the Bosco Program, the founders started a two-week summer camp where boys received a greater portion of the intended St. Joseph the Worker Academy experience. Learning Latin, poetry, and history while also felling trees and laying foundations, the participants utilized their summers well.
                      - listitem [ref=e238]:
                        - generic [ref=e240]:
                          - img [ref=e244]
                          - generic [ref=e247]:
                            - paragraph [ref=e250]:
                              - generic [ref=e251]: Phase III
                            - paragraph [ref=e253]: Expanding the Bosco Program
                            - generic [ref=e257]: As more families expressed interest, the founders began putting on the Bosco Program at four different times so that the trades experience was available for even more people. The program also began taking on greater projects, such as building two houses.
                      - listitem [ref=e258]:
                        - generic [ref=e260]:
                          - img [ref=e264]
                          - generic [ref=e267]:
                            - paragraph [ref=e270]:
                              - generic [ref=e271]: Phase IV
                            - paragraph [ref=e273]: Opening the Academy
                            - generic [ref=e277]: "In Fall 2025, the St. Joseph the Worker Academy opened its doors to three classes: Freshmen, Sophomores, and a combined class of Juniors and Seniors. Although the academy is currently at a temporary location, the enrolled boys have five days a week in which they can develop each aspect of man (i.e., his body, mind, and spirit)."
                      - listitem [ref=e278]:
                        - generic [ref=e280]:
                          - img [ref=e284]
                          - generic [ref=e287]:
                            - paragraph [ref=e290]:
                              - generic [ref=e291]: Phase V
                            - paragraph [ref=e293]: Acquiring a Permanent Location
                            - generic [ref=e297]: With either an endowment of a property or from the profits coming from our construction jobs, SJWA will work towards aquiring a permanent location for its school. The Bosco Program will spend the year before building the students' future classrooms giving them a sense of ownership of the place itself.

                - generic [ref=e125]:
                  - paragraph [ref=e126]: Theology is a science. To study any science well, one must know its principles, and one must have meaningful, direct encounters with its subject matter. Before one can reach the heights of theology, one must begin with the Church's catechisms, which present the basic principles of theology to students, and the Sacred Scriptures, which, together with Sacred Tradition, provide the subject matter.
                  - paragraph [ref=e127]:
                    - text: Our Theology track starts with a catechetical semester utilizing both the
                    - emphasis [ref=e128]: Catechism of the Catholic Church
                    - text: and the
                    - emphasis [ref=e129]: Baltimore Catechism
                    - text: ", and then it moves into (venerable translations of) the Old and New Testaments. Taking the Church Fathers as our model, students learn to read Scripture according to the manner in which the Church intends for her members. In the last portions of the track, we move beyond the Scriptures, focusing on the saints' recommendations for how one can grow in the spiritual life, and then finally reflect on the theological discipline itself, looking at the contributions of the Church Fathers, Doctors, Pontiffs, and Councils (along with their enemies') to see how theology has been and can be \"done\" well or poorly."

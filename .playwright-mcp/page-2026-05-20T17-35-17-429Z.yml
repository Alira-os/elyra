                - generic [ref=e82]:
                  - generic [ref=e83]:
                    - heading "Why a Boys School?" [level=1] [ref=e85]
                    - generic [ref=e86]:
                      - list [ref=e87]:
                        - listitem [ref=e88]:
                          - 'img "Writer: Dominic Perrotta" [ref=e91]'
                          - generic [ref=e92] [cursor=pointer]: Dominic Perrotta
                        - listitem [ref=e93]: ·Jan 4, 2024
                        - listitem [ref=e94]: ·2 min read
                      - button "More actions" [ref=e96] [cursor=pointer]:
                        - img [ref=e97]
                  - paragraph [ref=e99]: "Updated: May 24, 2024"
                - generic [ref=e106]:
                  - paragraph [ref=e108]:
                    - generic [ref=e110]: "Boys lag behind in the American education system. The modern school system is designed by women, and works well for girls. Boys need something further, something more tactile. Looking at John Bosco and John Senior we want to have a school that focuses on the whole person of the boy. As creatures made for union with God, we can only find true fulfillment through an ever-deepening relationship with Jesus Christ. And that relationship demands engagement from the whole person: body, mind and soul. In all that we do at this school – trades, study and prayer – we seek to create a rich and fertile soil for God to do His work in cultivating Saints. A boy coming out of our program needs to be an ideal candidate for anything, whether it is seminary, college, or working a trade."
                  - paragraph [ref=e115]:
                    - generic [ref=e116]:
                      - generic [ref=e117]: In a world that is constantly disparaging “toxic” masculinity and effeminating boys, we want to focus on nurturing authentic masculinity. (Not superficial bravado, but the true masculinity that comes from striving towards aurduis goods and seeing the fruits of one's labor.) Our culture wants to make us soft, but by regular contact with the animals, with the trades, with the
                      - emphasis [ref=e118]:
                        - generic [ref=e119]: Usus Antiquior,
                      - generic [ref=e120]: and with the Classics we will counteract this softness.
                  - paragraph [ref=e125]:
                    - generic [ref=e127]: All of this amounts to an education that relies heavily on first-hand experience of the world, and formation of the intellect through images over abstractions. This approach may be summarized as "gymnopoetic," from the Greek "gymnos" for bare and "poeisis" for making, from which the word poetry is derived. These two concepts summarize the distinctive aspects of this approach to forming men. It is a method that relies on forming a true image of the world and the self by work, by a first-hand "naked" encounter with creation through making beautiful things, and by beauty distilled in poetry and the other imaginative arts.
                  - paragraph [ref=e132]:
                    - generic [ref=e134]: This is why starting freshman year every student spends time daily working with their hands. This is most easily seen with the Wednesday trades day. Every Wednesday will be a focus on the trades. As Freshmen it will start with shop class, learning the various tools and how to do simple work. By the time they reach their Junior year they will be joining local tradesmen on jobsites, getting a real taste of the work and a sense of community.
                  - paragraph [ref=e139]:
                    - generic [ref=e140]:
                      - generic [ref=e141]: This school is also connected to the community; we are not a boarding school. To help engage the students with the life of their own families, we will emphasize family time. This means we want to be
                      - strong [ref=e142]:
                        - generic [ref=e143]: a school without homework.
                      - generic [ref=e144]: Readings are done in class as a group, and when they get home at the end of the day they can rest with their families. Furthermore the shop class will have a focus in building things to take home and learning skills that are applicable in the home.

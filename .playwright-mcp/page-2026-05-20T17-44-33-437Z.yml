                - heading "The Bosco Program" [level=2] [ref=e316]
                - generic [ref=e317]:
                  - paragraph [ref=e318]: "A fundamental part of the gymnastic and poetic aspects of the St. Joseph’s education is trades work. We do not have the boys learn carpentry and other trades so that they all become tradesmen but so they can begin to wonder, learn confidence, and practice fortitude. As St. John Bosco said: “It is not the end; it is rather the instrumental means for improving the way of life.”"
                  - paragraph [ref=e319]
                  - paragraph [ref=e320]: The Bosco Program provides young men with the opportunity to develop mastery in several crafts with the object of giving them a beautiful life and possibly a way to support their futures.

                - heading "Our Mission, Your Sons" [level=2] [ref=e84]
                - heading "St. Joseph the Worker Academy is an all-boys school in the Ann Arbor area based upon the educational philosophies of St. John Bosco and Dr. John Senior." [level=6] [ref=e86]
                - paragraph [ref=e89]: "\"As parents, our purpose is to raise sons in the image of our Heavenly Father. Raising sons to be good fathers means teaching them to love beauty through poetry, literature, and the first hand experience of the grandeur of creation. It means forming goodness and virtue by imitating Our Lord and his foster father St. Joseph in physical labor with other men. By learning about created things in the natural sciences, philosophy, the study of Scripture, and most of all by meeting Him in the Sacrifice of the Mass, it means coming to know the Truth, Who is Christ the Son.\""

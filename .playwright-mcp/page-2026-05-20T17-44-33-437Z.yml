                  - list:
                    - listitem [ref=e264]:
                      - group:
                        - generic [ref=e266]:
                          - heading "Classical" [level=3] [ref=e269]
                          - paragraph [ref=e271]: Classical education involves immersion in the great ideas, conversations, and methods of inquiry that comprise the Western Tradition, immersing students in the best of what has been thought and expressed, whether through books, plays, paintings, music, or architecture. Rather than diminishing the value of what has come before now, classical education sees that which has been handed down as part of our precious patrimony.
                    - listitem [ref=e272]:
                      - group:
                        - generic [ref=e274]:
                          - heading "Poetic" [level=3] [ref=e277]
                          - paragraph [ref=e279]: An education which makes frequent use of poetry, along with philosophy, concerns itself first and foremost with wonder. Much of today's analytically-focused educational models revolves around abstract thought (often divorced from real experiences), but a poetic education helps man recognize his unique place and role in the cosmos as a bridge between the material and immaterial worlds.
                    - listitem [ref=e280]:
                      - group:
                        - generic [ref=e282]:
                          - heading "Gymnastic" [level=3] [ref=e285]
                          - paragraph [ref=e287]: Gymnastic education involves the development of man's senses—five exterior and five interior—through exposure to tangible realities. While all acknowledge the importance of sight, hearing, and the rest of the exterior senses, many schools have forgotten the need for the imagination, memory, common sense, estimative sense, and illative sense.
            - generic [ref=e288]:
              - group

              - heading "Inshal Chenet, M.A." [level=4] [ref=e69]
              - heading "Headmaster" [level=5] [ref=e71]
            - paragraph [ref=e73]: "Mr. Chenet has lived in 18 different places around the globe since he was born in Bedford, Texas. He comes from a family of seven and his father served in the United States Air Force. After serving a year in NET ministries, Mr. Chenet went on to attend Wyoming Catholic College and received his B.A. in Liberal Arts, and then received an M.A. in Moral Theology from Christendom College. He teaches Science, Theology, History, and a variety of other subjects for Homeschool Connections and other local groups, and is currently writing his first book: Astronomy and Wonder. On the side, Mr. Chenet runs a hobby farm that includes a milk cow, meat rabbits, maple-tapping, bees, sheep and chickens. He is a certified COR backpacking instructor and enjoys canyoneering, caving, and camping when he can find the time for it. But most of all, Mr. Chenet loves spending time with his wife and four children and the vibrant community that they live in."
